name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [c3, esp32dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - name: 占位密钥（真实密钥已 gitignore；固件会回退到配网门户）
        run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e ${{ matrix.env }}

  # 防止浏览器一键安装器（docs/）静默漂移：
  # 重新构建固件 + 一个暂存 data/ 的 LittleFS 镜像（其中包含刚构建的默认屏蔽列表），
  # 并把产物提交回仓库。用 GITHUB_TOKEN 发起的推送不会再次触发 workflow，因此不会成环。
  web-installer:
    needs: firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio
      - name: 注入 Web/OTA 凭据（替换 secrets.example.h 中的占位符，再移动到目标位置）
        run: |
          cp src/secrets.example.h src/secrets.h
          # 为该预编译固件把编译期认证占位符替换为真实值。
          # （secrets.h 已 gitignore，因此这些值不会进入仓库；只有 docs/ 中编译后的二进制会携带。）
          # 下面的密码是*初始*登录密码——烧录后，可在仪表盘的“管理密码”面板
          # 通过 /setpass 在运行时修改（存于 NVS 命名空间 "auth"），无需重新烧录。
          sed -i \
            -e 's|static const char\* WEB_USER = "admin";|static const char* WEB_USER = "admin";|' \
            -e 's|static const char\* WEB_PASS = "CHANGE_ME_WEB_PASSWORD";|static const char* WEB_PASS = "mingdai";|' \
            -e 's|static const char\* OTA_PASS = "CHANGE_ME_OTA_PASSWORD";|static const char* OTA_PASS = "mingdai";|' \
            src/secrets.h
          grep -E 'WEB_(USER|PASS)|OTA_PASS' src/secrets.h
      - name: 将默认屏蔽列表构建到 data/ 暂存目录
        run: python3 tools/build_blocklist.py data/blocklist.bin
      - name: 编译固件 + LittleFS 镜像（暂存 data/）
        run: |
          pio run -e c3                  # firmware.bin、bootloader.bin、partitions.bin、boot_app0.bin
          pio run -e c3 -t buildfs       # 由 data/ 生成 littlefs.bin
      - name: 刷新 docs/ 中的安装器产物
        run: |
          b=.pio/build/c3
          # boot_app0.bin 是 ROM 引导桩：pio 不会重建它，
          # 已提交的副本对该板子有效，因此保持原样。
          cp $b/firmware.bin   docs/firmware.bin
          cp $b/bootloader.bin docs/bootloader.bin
          cp $b/partitions.bin docs/partitions.bin
          cp $b/littlefs.bin   docs/littlefs.bin
      - name: 提交回仓库（无变化时为空操作）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/firmware.bin docs/bootloader.bin docs/partitions.bin docs/boot_app0.bin docs/littlefs.bin
          git diff --cached --quiet || { git commit -m "docs: 刷新网页安装器构建产物 [skip ci]"; git push; }

  blocklist-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 解析 hosts、纯域名及 AdGuard 风格输入
        run: |
          printf '||ads.example.com^\n@@||ok.example.org^\n||ok.example.org^\n0.0.0.0 hosts.example.com\nplain.example.com\n/^regex$/\n' > t.txt
          python3 tools/build_blocklist.py t.bin t.txt
          test "$(stat -c%s t.bin)" -eq 15   # 3 条 × 5 字节
      - name: 单元测试
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v