[platformio]
default_envs = c3

[env]
; Pinned on purpose. An unpinned "espressif32" now resolves to platform 8.x (Arduino-ESP32 3.x), which
; this code does not build on yet (e.g. BOOT_PIN clashes with a core macro, setCACertBundle() takes a size).
; 7.1.3 is what the last green CI run used: Arduino-ESP32 2.0.17 / ESP-IDF 4.4.7, GCC 8.4.0.
platform = espressif32@7.1.3
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
; Compresses the dashboard page into the firmware (see tools/gzip_page.py): ~14 KB smaller.
extra_scripts = pre:tools/gzip_page.py
; Smaller image, same behaviour (about -88 KB together):
;  -fno-exceptions        nothing in this project or the Arduino libraries it uses throws/catches C++
;                         exceptions; dropping the unwind tables saves ~53 KB.
;  -DCORE_DEBUG_LEVEL=0   the stock build prints "[E][file.cpp:123] ..." error lines from the Arduino
;                         libraries on the USB serial port; this removes those strings and calls (~35 KB).
;                         Set it back to 1 to get them again while debugging.
build_unflags = -fexceptions
build_flags =
    -fno-exceptions
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
